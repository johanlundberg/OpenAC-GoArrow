name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# Build releases against a tagged OpenAC contract. Update OPENAC_TAG and
# plugin.json's minHostVersion together when the required contract changes.
env:
  OPENAC_TAG: "v0.1.16"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out GoArrow
        uses: actions/checkout@v4
        with:
          path: OpenAC-GoArrow

      # The plugin references the OpenAC abstractions project until the
      # published contract package is available. Check it out beside this repo
      # so Directory.Build.props resolves ../OpenAC in CI.
      - name: Check out OpenAC abstractions
        uses: actions/checkout@v4
        with:
          repository: eriknihlen/OpenAC
          ref: ${{ env.OPENAC_TAG }}
          path: OpenAC

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        working-directory: OpenAC-GoArrow
        run: dotnet restore tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj

      - name: Build tests and plugin
        working-directory: OpenAC-GoArrow
        run: dotnet build tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj --configuration Release --no-restore

      # The pinned OpenAC ref must actually supply the version GoArrow claims as
      # its minimum. If a future ref bumps the version without updating
      # plugin.json (or vice versa), fail here rather than shipping a package
      # built against an OpenAC version older than the manifest declares. The
      # check mirrors the host's own semantics: minHostVersion is a MINIMUM, so
      # a newer OpenAC (version >= minHostVersion) is acceptable; only an OpenAC
      # version that cannot supply the declared minimum is an error.
      - name: Verify minHostVersion does not exceed the resolved OpenAC version
        working-directory: OpenAC
        shell: bash
        run: |
          set -euo pipefail
          openac_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)"
          min_host_version="$(python3 -c 'import json;print(json.load(open("../OpenAC-GoArrow/src/AcDream.Plugins.GoArrow/plugin.json"))["minHostVersion"])')"
          # Check minHostVersion <= openac_version using version sort, so a newer
          # OpenAC (above the declared minimum) passes.
          ordered="$(printf '%s\n%s\n' "$min_host_version" "$openac_version" | sort -V | head -n1)"
          if [[ "$ordered" != "$min_host_version" ]]; then
            echo "plugin.json minHostVersion=$min_host_version exceeds OpenAC Version=$openac_version at ${{ env.OPENAC_TAG }}; raise OPENAC_TAG or lower minHostVersion" >&2
            exit 1
          fi
          echo "minHostVersion $min_host_version <= OpenAC Version $openac_version at ${{ env.OPENAC_TAG }}"

      - name: Run tests
        working-directory: OpenAC-GoArrow
        run: dotnet test tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj --configuration Release --no-restore --no-build

  # Check against OpenAC main as well as the pinned release. A breaking
  # change on main must fail before this workflow publishes a GoArrow release.
  forward-compat:
    name: Build and test against OpenAC main
    runs-on: ubuntu-latest

    steps:
      - name: Check out GoArrow
        uses: actions/checkout@v4
        with:
          path: OpenAC-GoArrow

      - name: Check out OpenAC at top of main
        uses: actions/checkout@v4
        with:
          repository: eriknihlen/OpenAC
          ref: main
          path: OpenAC

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OpenAC-GoArrow/tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj

      - name: Build tests and plugin
        run: dotnet build OpenAC-GoArrow/tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj --configuration Release --no-restore

      - name: Run tests against main
        run: dotnet test OpenAC-GoArrow/tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj --configuration Release --no-restore --no-build

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, forward-compat]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out GoArrow
        uses: actions/checkout@v4
        with:
          path: OpenAC-GoArrow
          fetch-depth: 0

      - name: Check out OpenAC abstractions
        uses: actions/checkout@v4
        with:
          repository: eriknihlen/OpenAC
          ref: ${{ env.OPENAC_TAG }}
          path: OpenAC

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got: $tag" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Restore plugin
        working-directory: OpenAC-GoArrow
        run: dotnet restore src/AcDream.Plugins.GoArrow/AcDream.Plugins.GoArrow.csproj

      - name: Publish plugin
        working-directory: OpenAC-GoArrow
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/goarrow-publish" "$RUNNER_TEMP/openac.goarrow-${VERSION}.zip"
          dotnet publish \
            src/AcDream.Plugins.GoArrow/AcDream.Plugins.GoArrow.csproj \
            --configuration Release \
            --no-restore \
            -p:Version="$VERSION" \
            --output "$RUNNER_TEMP/goarrow-publish"

          # plugin.json is the host-facing manifest. Keep its version aligned
          # with the Git tag rather than the development version in source.
          python3 - "$RUNNER_TEMP/goarrow-publish/plugin.json" "$VERSION" <<'PY'
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          # A plugin package contains only host-loadable plugin files. The
          # OpenAC abstractions assembly is supplied by the host.
          find "$RUNNER_TEMP/goarrow-publish" -maxdepth 1 -type f \
            ! -name 'AcDream.Plugins.GoArrow.dll' \
            ! -name 'AcDream.Plugins.GoArrow.deps.json' \
            ! -name 'AcDream.Plugins.GoArrow.pdb' \
            ! -name 'plugin.json' \
            ! -name 'goarrow-panel.xml' \
            -delete

          # The launcher installs from a zip with plugin.json at its ROOT,
          # and checks the zip against a .sha256 asset and the manifest
          # against a plugin.json asset that must match the zip's copy byte
          # for byte. See OpenAC docs/plugin-manifest.md, "Release".
          mkdir -p "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/goarrow-publish"
          files=(AcDream.Plugins.GoArrow.dll plugin.json goarrow-panel.xml)
          for optional in AcDream.Plugins.GoArrow.deps.json AcDream.Plugins.GoArrow.pdb; do
            if [[ -f "$optional" ]]; then files+=("$optional"); fi
          done
          zip "$RUNNER_TEMP/release-assets/openac.goarrow-${VERSION}.zip" "${files[@]}"
          cp plugin.json "$RUNNER_TEMP/release-assets/plugin.json"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum "openac.goarrow-${VERSION}.zip" > "openac.goarrow-${VERSION}.zip.sha256"

      # The same checks the launcher runs before it installs anything. A
      # release that fails here would be refused by every player's launcher.
      - name: Check the release zip the way the launcher will
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet run --project OpenAC/src/AcDream.PluginCheck --configuration Release --             "$RUNNER_TEMP/release-assets/openac.goarrow-${VERSION}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: OpenAC-GoArrow
        run: |
          gh release create "$GITHUB_REF_NAME"             "$RUNNER_TEMP/release-assets/plugin.json"             "$RUNNER_TEMP/release-assets/openac.goarrow-${VERSION}.zip"             "$RUNNER_TEMP/release-assets/openac.goarrow-${VERSION}.zip.sha256"             --title "GoArrow $GITHUB_REF_NAME"             --generate-notes
