name: CI and Release

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# OpenAC is checked out at the EXACT commit whose abstractions GoArrow is built
# and verified against, not at moving `main`. OpenAC's in-tree <Version> is not
# enough: 0.1.13 (for example) spans commits with and without the map/rendering
# contracts GoArrow needs, and there is no git tag for 0.1.13. Pinning here is
# what makes a GoArrow build and the client it runs on a true match.
#
# NOTE: the checkout tracks either a tag or a commit, not moving `main`. OpenAC's
# in-tree <Version> is not enough: 0.1.13 (for example) spans commits with and
# without the map/rendering contracts GoArrow needs. Pinning here is what makes
# a GoArrow build and the client it runs on a true match.
#
# Prefer a tag when the OpenAC maintainer tags releases again (e.g. OPENAC_TAG
# = v0.1.14). Until a suitable tag exists, fall back to the known-good commit
# SHA in OPENAC_REF below; the resolve step uses the tag only if it exists.
#
#   OPENAC_REF = 85211dbf  -> OpenAC "0.1.13" with map/rendering/resource contracts
#   OPENAC_TAG = v0.1.14   -> preferred once the maintainer tags that release
#
# Bump OPENAC_REF/OPENAC_TAG in the same commit that bumps minHostVersion in
# plugin.json, and make sure plugin.json's minHostVersion matches the OpenAC
# <Version> at the chosen ref.
env:
  OPENAC_REF: 85211dbfbee187d175a3cf4e2134cc35f5c45f82
  OPENAC_TAG: ""

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out GoArrow
        uses: actions/checkout@v4
        with:
          path: OpenAC-GoArrow

      # Resolve which OpenAC ref to build against. Use OPENAC_TAG when it names a
      # tag that actually exists on the OpenAC repo (so a tagged release is
      # honoured the moment the maintainer tags it), otherwise fall back to the
      # known-good commit SHA in OPENAC_REF.
      - name: Resolve OpenAC ref (tag preferred)
        id: openac-resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ env.OPENAC_TAG }}" ]] && \
             git ls-remote --tags https://github.com/eriknihlen/OpenAC \
               "refs/tags/${{ env.OPENAC_TAG }}" | grep -q .; then
            echo "ref=${{ env.OPENAC_TAG }}"
          else
            echo "ref=${{ env.OPENAC_REF }}"
          fi >> "$GITHUB_OUTPUT"

      # The plugin references the OpenAC abstractions project until the
      # published contract package is available. Check it out beside this repo
      # so Directory.Build.props resolves ../OpenAC in CI.
      - name: Check out OpenAC abstractions
        uses: actions/checkout@v4
        with:
          repository: eriknihlen/OpenAC
          ref: ${{ steps.openac-resolve.outputs.ref }}
          path: OpenAC

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        working-directory: OpenAC-GoArrow
        run: dotnet restore tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj

      - name: Build tests and plugin
        working-directory: OpenAC-GoArrow
        run: dotnet build tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj --configuration Release --no-restore

      # The pinned OpenAC ref must actually supply the version GoArrow claims as
      # its minimum. If a future ref bumps the version without updating
      # plugin.json (or vice versa), fail here rather than shipping a package
      # whose manifest names a host version that does not match the abstractions
      # it was compiled against.
      - name: Verify minHostVersion matches the pinned OpenAC version
        working-directory: OpenAC
        shell: bash
        run: |
          set -euo pipefail
          openac_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)"
          min_host_version="$(python3 -c 'import json;print(json.load(open("../OpenAC-GoArrow/src/AcDream.Plugins.GoArrow/plugin.json"))["minHostVersion"])')"
          if [[ "$min_host_version" != "$openac_version" ]]; then
            echo "plugin.json minHostVersion=$min_host_version does not match the OpenAC Version=$openac_version at ${{ steps.openac-resolve.outputs.ref }}" >&2
            exit 1
          fi
          echo "minHostVersion $min_host_version == OpenAC Version at ${{ steps.openac-resolve.outputs.ref }}"

      - name: Run tests
        working-directory: OpenAC-GoArrow
        run: dotnet test tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj --configuration Release --no-restore --no-build

  # Forward-compatibility signal. Kitária is concerned that a future OpenAC
  # release might change the plugin contract without breaking the pinned
  # release build (which only ever sees the resolved OPENAC_TAG/OPENAC_REF). This
  # job checks out OpenAC
  # top-of-main — the best available proxy for the next release — rebuilds and
  # re-runs the entire GoArrow suite against it. If OpenAC makes a breaking
  # change, this fails and alerts us before that "later release" ships to
  # players, while the pinned release job above still produces the package we
  # know works.
  forward-compat:
    name: Build and test against OpenAC main
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out GoArrow
        uses: actions/checkout@v4
        with:
          path: OpenAC-GoArrow

      - name: Check out OpenAC at top of main
        uses: actions/checkout@v4
        with:
          repository: eriknihlen/OpenAC
          ref: main
          path: OpenAC

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OpenAC-GoArrow/tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj

      - name: Build tests and plugin
        run: dotnet build OpenAC-GoArrow/tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj --configuration Release --no-restore

      - name: Run tests against main
        run: dotnet test OpenAC-GoArrow/tests/AcDream.Plugins.GoArrow.Tests/AcDream.Plugins.GoArrow.Tests.csproj --configuration Release --no-restore --no-build

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out GoArrow
        uses: actions/checkout@v4
        with:
          path: OpenAC-GoArrow
          fetch-depth: 0

      - name: Resolve OpenAC ref (tag preferred)
        id: openac-resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ env.OPENAC_TAG }}" ]] && \
             git ls-remote --tags https://github.com/eriknihlen/OpenAC \
               "refs/tags/${{ env.OPENAC_TAG }}" | grep -q .; then
            echo "ref=${{ env.OPENAC_TAG }}"
          else
            echo "ref=${{ env.OPENAC_REF }}"
          fi >> "$GITHUB_OUTPUT"

      - name: Check out OpenAC abstractions
        uses: actions/checkout@v4
        with:
          repository: eriknihlen/OpenAC
          ref: ${{ steps.openac-resolve.outputs.ref }}
          path: OpenAC

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, got: $tag" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Restore plugin
        working-directory: OpenAC-GoArrow
        run: dotnet restore src/AcDream.Plugins.GoArrow/AcDream.Plugins.GoArrow.csproj

      - name: Publish plugin
        working-directory: OpenAC-GoArrow
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/goarrow-publish" "$RUNNER_TEMP/openac.goarrow-${VERSION}.zip"
          dotnet publish \
            src/AcDream.Plugins.GoArrow/AcDream.Plugins.GoArrow.csproj \
            --configuration Release \
            --no-restore \
            -p:Version="$VERSION" \
            --output "$RUNNER_TEMP/goarrow-publish"

          # plugin.json is the host-facing manifest. Keep its version aligned
          # with the Git tag rather than the development version in source.
          python3 - "$RUNNER_TEMP/goarrow-publish/plugin.json" "$VERSION" <<'PY'
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          manifest = json.loads(manifest_path.read_text())
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

          # A plugin package contains only host-loadable plugin files. The
          # OpenAC abstractions assembly is supplied by the host.
          find "$RUNNER_TEMP/goarrow-publish" -maxdepth 1 -type f \
            ! -name 'AcDream.Plugins.GoArrow.dll' \
            ! -name 'AcDream.Plugins.GoArrow.deps.json' \
            ! -name 'AcDream.Plugins.GoArrow.pdb' \
            ! -name 'plugin.json' \
            ! -name 'goarrow-panel.xml' \
            -delete

          # The launcher installs from a zip with plugin.json at its ROOT,
          # and checks the zip against a .sha256 asset and the manifest
          # against a plugin.json asset that must match the zip's copy byte
          # for byte. See OpenAC docs/plugin-manifest.md, "Release".
          mkdir -p "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/goarrow-publish"
          files=(AcDream.Plugins.GoArrow.dll plugin.json goarrow-panel.xml)
          for optional in AcDream.Plugins.GoArrow.deps.json AcDream.Plugins.GoArrow.pdb; do
            if [[ -f "$optional" ]]; then files+=("$optional"); fi
          done
          zip "$RUNNER_TEMP/release-assets/openac.goarrow-${VERSION}.zip" "${files[@]}"
          cp plugin.json "$RUNNER_TEMP/release-assets/plugin.json"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum "openac.goarrow-${VERSION}.zip" > "openac.goarrow-${VERSION}.zip.sha256"

      # The same checks the launcher runs before it installs anything. A
      # release that fails here would be refused by every player's launcher.
      - name: Check the release zip the way the launcher will
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet run --project OpenAC/src/AcDream.PluginCheck --configuration Release --             "$RUNNER_TEMP/release-assets/openac.goarrow-${VERSION}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: OpenAC-GoArrow
        run: |
          gh release create "$GITHUB_REF_NAME"             "$RUNNER_TEMP/release-assets/plugin.json"             "$RUNNER_TEMP/release-assets/openac.goarrow-${VERSION}.zip"             "$RUNNER_TEMP/release-assets/openac.goarrow-${VERSION}.zip.sha256"             --title "GoArrow $GITHUB_REF_NAME"             --generate-notes
